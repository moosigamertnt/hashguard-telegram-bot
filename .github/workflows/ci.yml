name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Reject local secrets and generated files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.venv|__pycache__)(/|$)'; then
            echo "A local secret or generated path is tracked."
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=hash_bot --cov-report=term-missing --cov-report=xml

