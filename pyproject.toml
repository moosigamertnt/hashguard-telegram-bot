[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-password-hasher"
version = "1.0.0"
description = "A privacy-minded Telegram toolbox for Argon2id passwords and SHA-256 checksums"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HashGuard contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "argon2-cffi>=25.1.0,<26",
    "python-dotenv>=1.1.1,<2",
    "python-telegram-bot>=22.5,<23",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[project.scripts]
hash-bot = "hash_bot.bot:main"
hashguard = "hash_bot.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:If 'per_message=False'.*:telegram.warnings.PTBUserWarning",
]

[tool.coverage.run]
source = ["hash_bot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
